setupVersion: 1
startup:
  setupWizard: false
  checkUpdate: false
theme:
  dark: my-dark-synthwave
  light: light
defaultThinkingLevel: xhigh
hideThinkingBlock: true
advisor:
  enabled: true
  syncBacklog: "5"
tools:
  approvalMode: yolo
  xdevDocs: catalog
mcp:
  {}
providers:
  openai-codex:
    codeMode: auto
modelRoles:
  default: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-sonnet-5-5:xhigh
  smol: google/gemini-3.5-flash-lite:high
  tiny: fireworks/glm-5.3-flash:max
  slow: openai/gpt-6-astra:xhigh
  plan: anthropic/claude-opus-5-5:max
  advisor: openai/gpt-5.6-sol:high
  designer: xai/grok-4.7:xhigh
  vision: meta/muse-spark-1.3:max
  Alt: openai/gpt-6.1-sol:xhigh
  Alt2: google/gemini-3.8-flash:high
  AltPremium: anthropic/claude-fable-5-1:xhigh
  Alt3: fireworks/fireworks:accounts/fireworks/models/deepseek-v4p1-flash:max
  web: web/perplexity
skills:
  customDirectories:
    - ~/.pi/agent/skills
symbolPreset: unicode
colorBlindMode: false
statusLine:
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
terminal:
  showProgress: false
tui:
  textSizing: false
  tight: false
display:
  shimmer: classic
  cacheMissMarker: false
  showTokenUsage: false
  hideToolActivity: true
task:
  showResolvedModelBadge: false
  eager: default
  enableLsp: true
  isolation:
    commits: generic
  disabledAgents:
    - pr-test-analyzer
textVerbosity: low
personality: pragmatic
retry:
  modelFallback: true
  fallbackChains:
    web:
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
steeringMode: one-at-a-time
interruptMode: immediate
autocompleteMaxVisible: 7
recap:
  idleSeconds: 300
stt:
  enabled: false
  submitTrigger: never
power:
  sleepPrevention: system
features:
  unexpectedStopDetection: smart
contextPromotion:
  enabled: false
memory:
  backend: local
autolearn:
  enabled: true
edit:
  mode: hashline
  blockAutoGenerated: true
github:
  enabled: true
todo:
  eager: default
browser:
  screenshotDir: ~/Downloads
  cmux: false
commands:
  enableOpencodeUser: false
  enableOpencodeProject: false
tts:
  localVoice: af_heart
secrets:
  enabled: false
dev:
  autoqaConsent: granted
  autoqa: false
cycleOrder:
  - smol
  - default
  - advisor
  - Alt2
  - Alt3
  - Alt
  - AltPremium
  - slow
disabledProviders:
  - ollama
  - lm-studio
  - llama.cpp
bashInterceptor:
  enabled: true
composer:
  shape: claude
astGrep:
  enabled: true
generate_image:
  enabled: true
git:
  enabled: false